*, *::before, *::after { box-sizing: border-box; }
body { margin:0; background:#030712; font-family:'Noto Sans KR',sans-serif; overflow-x:hidden; }

/* Keyframes */
@keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeDown { from{opacity:0;transform:translateY(-24px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes scaleIn { from{opacity:0;transform:scale(.88)} to{opacity:1;transform:scale(1)} }
@keyframes slideRight { from{opacity:0;transform:translateX(-32px)} to{opacity:1;transform:translateX(0)} }
@keyframes slideLeft { from{opacity:0;transform:translateX(32px)} to{opacity:1;transform:translateX(0)} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes orb { 0%,100%{transform:scale(1) translate(0,0)} 33%{transform:scale(1.05) translate(20px,-10px)} 66%{transform:scale(.97) translate(-10px,15px)} }
@keyframes drawLine { to{stroke-dashoffset:0} }
@keyframes blinkDot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(.8)} }
@keyframes spinSlow { from{transform:rotate(0)} to{transform:rotate(360deg)} }
@keyframes neonFlicker { 0%,100%{opacity:1} 50%{opacity:.85} }
@keyframes countUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes progressFill { from{width:0} to{width:var(--w)} }
@keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
@keyframes popIn { 0%{opacity:0;transform:scale(.5) rotate(-10deg)} 80%{transform:scale(1.05) rotate(2deg)} 100%{opacity:1;transform:scale(1) rotate(0)} }
@keyframes scanline { 0%{top:-10%} 100%{top:110%} }
@keyframes pulseRing { 0%{transform:scale(1);opacity:.6} 100%{transform:scale(2.2);opacity:0} }

/* Utilities */
.fade-up { animation:fadeUp .55s ease-out both }
.fade-down { animation:fadeDown .5s ease-out both }
.fade-in { animation:fadeIn .5s ease-out both }
.scale-in { animation:scaleIn .55s cubic-bezier(.34,1.56,.64,1) both }
.slide-right { animation:slideRight .5s ease-out both }
.slide-left { animation:slideLeft .5s ease-out both }

.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}
.d4{animation-delay:.2s}.d5{animation-delay:.25s}.d6{animation-delay:.3s}
.d7{animation-delay:.35s}.d8{animation-delay:.4s}.d9{animation-delay:.45s}

/* District Node on map */
.dist-node {
  cursor:pointer;
  transition:filter .3s, transform .35s cubic-bezier(.34,1.56,.64,1);
  filter:drop-shadow(0 0 0 transparent);
}
.dist-node:hover { transform:scale(1.13); }

/* Card hover */
.card {
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s, border-color .3s;
  cursor:pointer;
}
.card:hover { transform:translateY(-5px) scale(1.01); box-shadow:0 20px 40px rgba(0,0,0,.5); }

/* Subway paths */
.metro-line { stroke-dasharray:600; stroke-dashoffset:600; animation:drawLine 1.8s ease-out forwards; }
.metro-1 { animation-delay:.2s } .metro-2 { animation-delay:.4s } .metro-3 { animation-delay:.6s }
.metro-4 { animation-delay:.8s } .metro-5 { animation-delay:1s }  .metro-6 { animation-delay:1.2s }
.metro-7 { animation-delay:1.4s }

/* Pulsing dot */
.pulse-dot::after {
  content:''; position:absolute; inset:0; border-radius:50%;
  animation:pulseRing 1.5s ease-out infinite;
}

/* Neon effect */
.neon-pink  { text-shadow:0 0 10px #ec4899,0 0 30px #ec489960 }
.neon-purple{ text-shadow:0 0 10px #a855f7,0 0 30px #a855f760 }
.neon-orange{ text-shadow:0 0 10px #f97316,0 0 30px #f9731660 }
.neon-cyan  { text-shadow:0 0 10px #06b6d4,0 0 30px #06b6d460 }
.neon-lime  { text-shadow:0 0 10px #84cc16,0 0 30px #84cc1660 }
.neon-emerald{text-shadow:0 0 10px #10b981,0 0 30px #10b98160 }
.neon-rose  { text-shadow:0 0 10px #f43f5e,0 0 30px #f43f5e60 }
.neon-sky   { text-shadow:0 0 10px #0ea5e9,0 0 30px #0ea5e960 }

/* Scanline overlay */
.scanlines::after {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);
  z-index:99;
}

/* Progress bar */
.prog-bar { transition:width .9s cubic-bezier(.34,1.56,.64,1) }

/* Checkbox */
.check-item { transition:all .25s ease; cursor:pointer; }
.check-item:hover { transform:translateX(4px); }

/* Shimmer for loading */
.shimmer {
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);
  background-size:200% 100%; animation:shimmer 1.5s infinite;
}

/* Back button */
.back-btn { transition:all .2s ease; }
.back-btn:hover { transform:translateX(-3px); color:white; }

/* Neighbor card */
.nbr-card {
  transition:all .3s cubic-bezier(.34,1.56,.64,1);

}
.nbr-card:hover { transform:translateY(-6px) scale(1.02); }

    linear-gradient(90deg,rgba(255,255,255,.015) 1px, transparent 1px);
  background-size:40px 40px;
}

/* Typography */
.kr-title { letter-spacing:-.01em; }
.mono { font-family:'Courier New',monospace; }
</style>

const UNSPLASH_KEY = 'ohTRfcr-97spBiKmAxdMNxMwBDwH1ZZgiyoCXdguG_Y';

async function fetchPhoto(query) {
  try {
    const res = await fetch(`https://api.unsplash.com/search/photos?query=${encodeURIComponent(query)}&client_id=${UNSPLASH_KEY}&per_page=3&orientation=landscape`);
    const data = await res.json();
    if (data.results && data.results.length > 0) {
      const pick = data.results[Math.floor(Math.random() * Math.min(3, data.results.length))];
      return { url: pick.urls.regular, thumb: pick.urls.small, credit: pick.user.name, creditLink: pick.links ? pick.links.html : '#' };
    }
  } catch(e) { console.warn('Unsplash fetch failed:', query); }
  return null;
}

function HanRiverContent({ departureDate, setDepartureDate }) {

      const now=new Date(), target=new Date(departureDate+'T06:00:00'), diff=target-now;
      if(diff<=0){setCd({days:0,hours:0,minutes:0,seconds:0});return;}
      setCd({days:Math.floor(diff/86400000),hours:Math.floor(diff%86400000/3600000),
        minutes:Math.floor(diff%3600000/60000),seconds:Math.floor(diff%60000/1000)});

    tick(); const iv=setInterval(tick,1000); return()=>clearInterval(iv);

    { id:'s3', emoji:'🚇', title:'Subway Life Hack', hint:'How locals move for less',
      content:'Base transfer discount: take metro + bus within 30 min = no extra charge. Buy IPHONE CASE at Sinchon market, not Myeongdong (30% cheaper). Night bus is FREE after midnight for metro card holders on last Friday of month.' },
    { id:'s4', emoji:'☕', title:'Café District Loop', hint:'The route locals don\'t post online',
      content:'Start: Yeonnam-dong → Mangwon → Seongsu-dong "Seoul\'s Brooklyn" → Ikseondong Hanok Cafés → end at Ikseon Bar Street. Best afternoon 3hrs you can spend in Seoul.' },
    { id:'s5', emoji:'🌙', title:'Midnight Seoul', hint:'The city that literally never sleeps',
      content:'Dongdaemun Design Plaza open until 3AM. Street pojangmacha bars open until dawn. Gangnam clubs charge €15 entry but drinks are free inside. Noryangjin Fish Market best visited at 3-4AM for cheapest prices.' },
    { id:'s6', emoji:'🗣️', title:'Language Exchange', hint:'Meet Seoul before you even leave',
      content:'Language Exchange Seoul (Facebook group) has free weekly meetups. HelloTalk app connects you with Korean speakers NOW. Say "도와주세요" (doh-wah-jew-seh-yo) = "Please help me" — Koreans will go out of their way to assist.' },
  ];
  return (
    <div className="space-y-4 fade-up">
      <p className="text-slate-400 text-sm fade-up">🔍 You found Bukchon. Most tourists don't come this far. Click each alley to reveal what's inside.</p>
      {secrets.map((s,i)=>(
        <div key={s.id} className={`fade-up d${i+1} border rounded-xl overflow-hidden transition-all cursor-pointer card`}
          style={{borderColor:discovered[s.id]?'#84cc1660':'#33415540',background:discovered[s.id]?'rgba(132,204,22,0.05)':'rgba(15,23,42,0.6)'}}
          onClick={()=>setDiscovered(d=>({...d,[s.id]:!d[s.id]}))}>
          <div className="flex items-center justify-between p-4">
            <div className="flex items-center gap-3">
              <span className="text-2xl">{s.emoji}</span>
              <div>
                <p className="text-white font-bold">{s.title}</p>
                <p className="text-slate-400 text-sm italic">{s.hint}</p>
              </div>
            </div>
            <span className={`text-sm px-3 py-1 rounded-full font-semibold transition-all ${discovered[s.id]?'bg-lime-500/20 text-lime-400':'bg-slate-700/50 text-slate-400'}`}>
              {discovered[s.id] ? '✓ Revealed' : '→ Enter'}
            </span>
          </div>
          {discovered[s.id] && (
            <div className="px-4 pb-4 border-t border-lime-500/20">
              <p className="text-slate-200 text-sm leading-relaxed pt-3">{s.content}</p>
            </div>
          )}
        </div>
      ))}
      {Object.values(discovered).filter(Boolean).length === secrets.length && (
        <div className="scale-in bg-gradient-to-br from-lime-950 to-slate-950 border-2 border-lime-500 rounded-2xl p-8 text-center">
          <p className="text-4xl mb-3">🏮</p>
          <p className="text-lime-400 font-black text-2xl neon-lime mb-2">진짜 서울 여행자</p>
          <p className="text-lime-300 text-sm">Real Seoul Traveler. You uncovered all of Bukchon. You're ready for Korea.</p>
        </div>
      )}
    </div>
  );
}

/* ──────────────────────────────────────────────
   CITY MAP (Main View)
──────────────────────────────────────────────── */
function CityMap({ onEnter, photos, photosLoading }) {
  const [hovered, setHovered] = useState(null);
  const dists = Object.values(DISTRICTS);
  return (
    <div className="min-h-screen grid-lines scanlines" style={{background:'linear-gradient(135deg,#010409 0%,#030712 50%,#010409 100%)'}}>
      {/* Ambient orbs */}
      <div className="fixed inset-0 pointer-events-none overflow-hidden">
        {dists.slice(0,4).map((d,i)=>(
          <div key={d.id} className="absolute w-96 h-96 rounded-full blur-3xl opacity-5"
            style={{background:d.color,left:`${d.x}%`,top:`${d.y}%`,transform:'translate(-50%,-50%)',
              animation:`orb ${8+i}s ease-in-out infinite`,animationDelay:`${i*2}s`}}/>
        ))}
      </div>

      {/* Header */}
      <header className="relative z-20 border-b border-slate-800/80 backdrop-blur-sm px-8 py-6 fade-down">
        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
          <div>
            <h1 className="text-5xl font-black bg-gradient-to-r from-pink-400 via-cyan-400 to-amber-400 bg-clip-text text-transparent kr-title">
              🇰🇷 Korea 2027
            </h1>
            <p className="text-slate-500 text-sm mt-1">Navigate like Seoul • Each district holds a different part of your journey</p>
          </div>
          <div className="text-right">
            <p className="text-slate-400 text-xs mono">LIÈGE → SEOUL</p>
            <p className="text-slate-400 text-xs mono">JULY 2027</p>
            {photosLoading && <p className="text-slate-600 text-xs mt-1 animate-pulse">Loading city photos…</p>}
          </div>
        </div>
      </header>

      {/* Map + Districts */}
      <div className="relative z-10 flex-1 px-6 py-8">
        <div className="max-w-7xl mx-auto">
          {/* SVG Subway Lines */}
          <svg className="absolute inset-0 w-full h-full pointer-events-none" style={{zIndex:5}} viewBox="0 0 100 100" preserveAspectRatio="none">
            {METRO_LINES.map((line,i)=>{
              const f=DISTRICTS[line.from], t=DISTRICTS[line.to];
              return <line key={i} x1={`${f.x}%`} y1={`${f.y}%`} x2={`${t.x}%`} y2={`${t.y}%`}
                stroke={line.color} strokeWidth=".3" opacity=".5"
                className={`metro-line metro-${i+1}`}/>;
            })}
          </svg>

          {/* District Nodes */}
          <div className="relative" style={{height:'75vh',minHeight:480}}>
            {dists.map(d=>{
              const photo = photos[d.id];
              return (
                <button key={d.id}
                  className="absolute transform -translate-x-1/2 -translate-y-1/2 dist-node group"
                  style={{left:`${d.x}%`,top:`${d.y}%`,zIndex:10}}
                  onMouseEnter={()=>setHovered(d.id)}
                  onMouseLeave={()=>setHovered(null)}
                  onClick={()=>onEnter(d.id)}>

                  {/* Pulse ring */}
                  <div className="absolute inset-0 rounded-2xl opacity-30"
                    style={{background:d.color,animation:`pulseRing 2s ease-out infinite`,animationDelay:`${Math.random()*1.5}s`}} />

                  {/* Main node — photo background if available */}
                  <div className="relative rounded-2xl border-2 overflow-hidden transition-all"
                    style={{
                      borderColor:`${d.color}80`,
                      boxShadow:`0 0 24px ${d.color}40`,
                      width: d.id==='hanriver' ? 110 : 90,
                    }}>
                    {/* Photo layer */}
                    {photo ? (
                      <div className="absolute inset-0 z-0">
                        <img src={photo.thumb} alt={d.name} className="w-full h-full object-cover opacity-60"
                          style={{transition:'opacity .5s'}}/>
                        <div className="absolute inset-0" style={{background:`linear-gradient(135deg,${d.color}70,${d.color}30)`}}/>
                      </div>
                    ) : (
                      <div className="absolute inset-0 z-0" style={{background:`linear-gradient(135deg,${d.color}30,${d.color}10)`}}/>
                    )}
                    {/* Content on top */}
                    <div className="relative z-10 p-4">
                      <div className="text-2xl text-center mb-1">{d.emoji}</div>
                      <p className="text-white text-xs font-bold text-center leading-tight drop-shadow">{d.name.split(' ')[0]}</p>
                    </div>
                  </div>

                  {/* Hover tooltip */}
                  {hovered===d.id && (
                    <div className="absolute bottom-full mb-3 left-1/2 -translate-x-1/2 bg-slate-900/95 border border-slate-700 rounded-xl overflow-hidden text-left w-56 pointer-events-none scale-in"
                      style={{zIndex:99,borderColor:`${d.color}50`,boxShadow:`0 0 30px ${d.color}25`}}>
                      {/* Tooltip photo strip */}
                      {photo && (
                        <div className="relative h-24 overflow-hidden">
                          <img src={photo.thumb} alt={d.name} className="w-full h-full object-cover"/>
                          <div className="absolute inset-0" style={{background:`linear-gradient(to bottom,transparent,rgba(2,6,23,.9))`}}/>
                          <p className="absolute bottom-2 right-2 text-slate-400 text-xs">{photo.credit}</p>
                        </div>
                      )}
                      <div className="p-3">
                        <p className="font-bold text-sm mb-0.5" style={{color:d.color}}>{d.name}</p>
                        <p className="text-slate-400 text-xs mb-1">{d.title}</p>
                        <p className="text-slate-500 text-xs">{d.sub}</p>
                      </div>
                    </div>
                  )}
                </button>
              );
            })}
          </div>

          {/* Legend */}
          <div className="mt-4 flex flex-wrap gap-3 justify-center fade-up">
            {dists.map(d=>(
              <button key={d.id} onClick={()=>onEnter(d.id)}
                className="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium transition-all hover:scale-105"
                style={{background:`${d.color}15`,border:`1px solid ${d.color}40`,color:d.color}}>
                <span>{d.emoji}</span>{d.name.split(' ')[0]}
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ──────────────────────────────────────────────
   DISTRICT VIEW
──────────────────────────────────────────────── */
function DistrictView({ districtId, onBack, onEnterOther, savingsData, setSavingsData, departureDate, setDepartureDate, discovered, setDiscovered, photos }) {
  const d = DISTRICTS[districtId];
  const photo = photos[districtId];

  const renderContent = () => {
    switch(districtId) {
      case 'gangnam': return <GangnamContent savingsData={savingsData} setSavingsData={setSavingsData}/>;
      case 'hongdae': return <HongdaeContent/>;
      case 'myeongdong': return <MyeongdongContent/>;
      case 'dongdaemun': return <DongdaemunContent/>;
      case 'itaewon': return <ItaewonContent/>;
      case 'cheonggyecheon': return <CheonggyecheonContent/>;
      case 'hanriver': return <HanRiverContent departureDate={departureDate} setDepartureDate={setDepartureDate}/>;
      case 'bukchon': return <BukchonContent discovered={discovered} setDiscovered={setDiscovered}/>;
      default: return null;
    }
  };

  const others = Object.values(DISTRICTS).filter(x=>x.id!==districtId);

  return (
    <div className="min-h-screen grid-lines" style={{background:'linear-gradient(135deg,#010409,#030712)'}}>
      <div className="fixed inset-0 pointer-events-none overflow-hidden opacity-10">
        <div className="absolute w-[600px] h-[600px] rounded-full blur-3xl -top-40 -left-40"
          style={{background:d.color,animation:'orb 10s ease-in-out infinite'}}/>
      </div>

      <header className="sticky top-0 z-30 border-b border-slate-800/80 backdrop-blur-sm px-6 py-4 fade-down">
        <div className="max-w-5xl mx-auto flex items-center justify-between">
          <div className="flex items-center gap-3">
            <button onClick={onBack} className="back-btn text-slate-400 text-sm flex items-center gap-1">← 지도 (Map)</button>
            <span className="text-slate-700">›</span>
            <span className="font-bold text-sm" style={{color:d.color}}>{d.name}</span>
          </div>
          <div className="hidden sm:flex gap-1.5 overflow-x-auto">
            {others.slice(0,5).map(o=>(
              <button key={o.id} onClick={()=>onEnterOther(o.id)}
                className="text-xs px-2 py-1 rounded-lg transition-all hover:scale-105"
                style={{background:`${o.color}15`,color:`${o.color}cc`,border:`1px solid ${o.color}25`}}>
                {o.emoji}
              </button>
            ))}
          </div>
        </div>
      </header>

      {/* Full-bleed photo hero */}
      <div className="relative overflow-hidden" style={{minHeight:300}}>
        {photo ? (
          <div className="absolute inset-0 z-0">
            <img src={photo.url} alt={d.name} className="w-full h-full object-cover fade-in"
              style={{opacity:.5,objectPosition:'center 40%'}}/>
            <div className="absolute inset-0" style={{
              background:`linear-gradient(to bottom,${d.color}25 0%,rgba(2,6,23,.75) 55%,#030712 100%)`
            }}/>
          </div>
        ) : (
          <div className="absolute inset-0 z-0" style={{background:`linear-gradient(135deg,${d.color}12,transparent)`}}/>
        )}
        <div className="relative z-10 max-w-5xl mx-auto px-6 py-12 scale-in">
          <div className="text-6xl mb-3 drop-shadow-lg">{d.emoji}</div>
          <h1 className={`text-5xl font-black text-white mb-2 kr-title drop-shadow-lg ${d.neon}`}>{d.name}</h1>
          <p className="text-slate-300 text-lg mb-2 drop-shadow">{d.title} · {d.sub}</p>
          <p className="text-slate-400 text-sm max-w-lg leading-relaxed">{d.desc}</p>
          {photo && (
            <p className="mt-3 text-slate-600 text-xs">Photo by <a href={photo.creditLink} target="_blank" rel="noopener noreferrer" className="hover:text-slate-400 underline">{photo.credit}</a> on Unsplash</p>
          )}
        </div>
      </div>

      <div className="relative z-10 max-w-5xl mx-auto px-6 pb-12">
        {renderContent()}
        <div className="mt-12 border-t border-slate-800 pt-8">
          <p className="text-slate-500 text-xs uppercase tracking-widest mb-4 flex items-center gap-2">
            <span>🚇</span> Connected districts — take the next line
          </p>
          <div className="flex flex-wrap gap-3">
            {others.map(o=>{
              const op = photos[o.id];
              return (
                <button key={o.id} onClick={()=>onEnterOther(o.id)}
                  className="card flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm transition-all overflow-hidden relative"
                  style={{background:`${o.color}12`,border:`1px solid ${o.color}35`,color:`${o.color}dd`}}>
                  {op && <div className="absolute inset-0 z-0 overflow-hidden rounded-xl"><img src={op.thumb} alt="" className="w-full h-full object-cover opacity-10"/></div>}
                  <span className="relative z-10">{o.emoji}</span>
                  <span className="relative z-10 font-semibold">{o.name.split(' ')[0]}</span>
                  <span className="relative z-10 text-xs opacity-60 hidden sm:inline">{o.title}</span>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ──────────────────────────────────────────────
   ROOT APP
──────────────────────────────────────────────── */
function App() {
  const [current, setCurrent] = useState(null);
  const [savings, setSavings] = useState({s2026:0,sy:0,x2026:0,e2027:0,j2027:0});
  const [departure, setDeparture] = useState('2027-07-07');
  const [discovered, setDiscovered] = useState({});
  const [photos, setPhotos] = useState({});
  const [photosLoading, setPhotosLoading] = useState(true);

  useEffect(() => {
    async function loadAll() {
      const entries = await Promise.all(
        Object.values(DISTRICTS).map(async d => {
          const photo = await fetchPhoto(d.photoQuery);
          return [d.id, photo];
        })
      );
      setPhotos(Object.fromEntries(entries));
      setPhotosLoading(false);
    }
    loadAll();
  }, []);

  if (!current) return <CityMap onEnter={setCurrent} photos={photos} photosLoading={photosLoading}/>;

  return <DistrictView
    districtId={current}
    onBack={()=>setCurrent(null)}
    onEnterOther={id=>{setCurrent(null);setTimeout(()=>setCurrent(id),50);}}
    savingsData={savings} setSavingsData={setSavings}
    departureDate={departure} setDepartureDate={setDeparture}
    discovered={discovered} setDiscovered={setDiscovered}
    photos={photos}
  />;
}

ReactDOM.render(<App/>, document.getElementById('root'));
    </script>
</body>
</html>
